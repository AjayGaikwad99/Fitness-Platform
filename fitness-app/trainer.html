<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trainer Social Profile | GoFit-999</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #e0eafc 0%, #cfdef3 100%);
      margin: 0;
      min-height: 100vh;
    }
    .navbar {
      background: #232a34;
      color: #fff;
      padding: 18px 0;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 28px;
      box-shadow: 0 2px 10px rgba(44,62,80,0.09);
    }
    .container {
      background: #fff;
      max-width: 430px;
      margin: 20px auto 30px;
      border-radius: 16px;
      box-shadow: 0 6px 28px rgba(44,62,80,0.13);
      padding: 40px 32px 28px;
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #232a34;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    .subtext {
      text-align: center;
      color: #888;
      font-size: 1rem;
      margin-bottom: 24px;
    }
    .panel {
      background: #f8fafb;
      border: 1px solid #e5e5e5;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 24px;
    }
    .panel button, .panel a {
      margin: 8px 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: background 0.2s;
    }
    .btn-dashboard {
      background: #2189ff;
    }
    .btn-dashboard:hover {
      background: #1a6fcc;
    }
    .btn-signout {
      background: #e74c3c;
    }
    .btn-signout:hover {
      background: #c0392b;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
      color: #232a34;
      letter-spacing: 0.2px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 11px;
      margin-top: 7px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      font-size: 1rem;
      background: #f8fafb;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #23c483;
    }
    button, .auth-btns button {
      margin-top: 22px;
      width: 100%;
      padding: 13px 0;
      background: linear-gradient(90deg,#23c483,#2189ff);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      box-shadow: 0 1px 6px rgba(44,62,80,0.08);
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    button:hover, .auth-btns button:hover {
      background: linear-gradient(90deg,#2189ff,#23c483);
    }
    .auth-btns {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      margin-bottom: 10px;
    }
    .auth-btns button {
      width: 50%;
      margin: 0;
      padding: 10px 0;
      font-size: 1rem;
      border-radius: 5px;
    }
    .divider {
      margin: 32px 0 22px;
      border: none;
      border-top: 1.5px dashed #e5e5e5;
    }
    #authMsg, #saveMsg {
      color: #e74c3c;
      font-size: 0.97rem;
      text-align: center;
    }
    #saveMsg.success {
      color: #23c483;
    }
    .browse-link {
      display: block;
      margin: 30px auto 0;
      text-align: center;
      color: #2189ff;
      font-weight: 500;
      text-decoration: none;
      font-size: 1.1rem;
      letter-spacing: 0.2px;
      transition: color 0.2s;
    }
    .browse-link:hover {
      color: #23c483;
    }
    @media (max-width: 600px) {
      .container { padding: 18px 7vw; }
      .navbar { font-size: 1.25rem; }
    }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="navbar">GoFit Trainers Network</div>

  <div class="container">
    <h2>Welcome Trainer!</h2>
    <div class="subtext">Sign up or sign in to create your social trainer profile. Connect, share, and inspire!</div>

    <!-- ALREADY SIGNED IN PANEL -->
    <div id="signedInPanel" class="panel" style="display:none;">
      <p>You’re signed in as <span id="signedInEmail"></span></p>
      <button class="btn-dashboard" id="dashboardBtn">Go to Dashboard</button>
      <button class="btn-signout" id="signOutBtn">Sign Out</button>
    </div>

    <!-- Authentication Form -->
    <form id="authForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <div class="auth-btns">
        <button type="button" id="signupBtn">Sign Up</button>
        <button type="button" id="signinBtn">Sign In</button>
      </div>
      <p id="authMsg"></p>
    </form>

    <hr class="divider">

    <!-- Trainer Profile Form -->
    <form id="trainerForm">
      <label>Name</label>
      <input type="text" id="name" required>
      <label>Certificate</label>
      <input type="text" id="certificate" required>
      <label>Bio</label>
      <textarea id="bio" rows="3" required placeholder="Tell the world about your journey, vision, or motto..."></textarea>
      <label>Specialist</label>
      <input type="text" id="specialist" required>
      <label>Hiring Rate ($/hr)</label>
      <input type="number" id="rate" min="0" required>
      <button type="submit">Save Profile</button>
      <p id="saveMsg"></p>
    </form>

    <a class="browse-link" href="user.html">🌍 Browse Trainer Community</a>
  </div>

  <script>
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDQwqNuIDSbaUfH_N6sy1fVZ1sZKHgbpwc",
      authDomain: "gofit-999.firebaseapp.com",
      projectId: "gofit-999",
      storageBucket: "gofit-999.appspot.com",
      messagingSenderId: "655870780801",
      appId: "1:655870780801:web:292d28dbca3e6e00b9b480"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db   = firebase.firestore();

    const authForm       = document.getElementById('authForm');
    const trainerForm    = document.getElementById('trainerForm');
    const signedInPanel  = document.getElementById('signedInPanel');
    const signedInEmail  = document.getElementById('signedInEmail');
    const dashboardBtn   = document.getElementById('dashboardBtn');
    const signOutBtn     = document.getElementById('signOutBtn');
    const authMsg        = document.getElementById('authMsg');
    const saveMsg        = document.getElementById('saveMsg');

    // Monitor auth state
    auth.onAuthStateChanged(user => {
      if (user) {
        signedInEmail.textContent = user.email;
        signedInPanel.style.display = 'block';
        authForm.style.display       = 'none';
      } else {
        signedInPanel.style.display = 'none';
        authForm.style.display       = 'block';
      }
    });

    // Dashboard link
    dashboardBtn.onclick = () => {
      window.location.href = 'trainerdashboard.html';
    };

    // Sign out
    signOutBtn.onclick = () => {
      auth.signOut();
    };

    // Sign up
    document.getElementById('signupBtn').onclick = async () => {
      authMsg.textContent = '';
      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        await auth.createUserWithEmailAndPassword(email, password);
        authMsg.textContent = "Signed up and logged in!";
        authMsg.style.color = "#23c483";
      } catch (e) {
        authMsg.textContent = e.message;
        authMsg.style.color = "#e74c3c";
      }
    };

    // Sign in
    document.getElementById('signinBtn').onclick = async () => {
      authMsg.textContent = '';
      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        await auth.signInWithEmailAndPassword(email, password);
        authMsg.textContent = "Sign in successful!";
        authMsg.style.color = "#23c483";
      } catch (e) {
        authMsg.textContent = e.message;
        authMsg.style.color = "#e74c3c";
      }
    };

    // Save Trainer Profile
    trainerForm.onsubmit = async e => {
      e.preventDefault();
      saveMsg.textContent = '';
      saveMsg.classList.remove('success');

      const user = auth.currentUser;
      if (!user) {
        saveMsg.textContent = "You must be signed in!";
        return;
      }

      const name       = document.getElementById('name').value.trim();
      const certificate= document.getElementById('certificate').value.trim();
      const bio        = document.getElementById('bio').value.trim();
      const specialist = document.getElementById('specialist').value.trim();
      const rate       = document.getElementById('rate').value.trim();

      if (!name || !certificate || !bio || !specialist || !rate) {
        saveMsg.textContent = "Please complete all fields.";
        return;
      }

      try {
        await db.collection('trainers').doc(user.uid).set({
          uid: user.uid,
          name,
          certificate,
          bio,
          specialist,
          rate,
          email: user.email,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        saveMsg.textContent = "Profile saved! Redirecting to dashboard...";
        saveMsg.classList.add('success');
        setTimeout(() => window.location.href = "trainerdashboard.html", 950);
      } catch (err) {
        saveMsg.textContent = err.message;
      }
    };
  </script>
</body>
</html>
