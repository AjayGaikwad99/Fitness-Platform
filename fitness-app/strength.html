<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Strength Checker with Animated Background</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Animated gradient background */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(45deg, #eef2f5, #dfe7ed, #e8eff5);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    @keyframes gradientBG {
      0%   { background-position:   0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position:   0% 50%; }
    }

    .container {
      background: #fff;
      max-width: 400px;
      width: 100%;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #232a34;
    }

    form {
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 4px;
      color: #333;
    }

    .form-group input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .form-group input:focus {
      border-color: #2189ff;
      box-shadow: 0 0 0 2px rgba(33,137,255,0.2);
      outline: none;
    }

    #calculateBtn {
      padding: 12px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #calculateBtn:hover {
      background: #218838;
    }

    /* Modal overlay */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease forwards;
    }

    .modal.show {
      display: flex;
    }

    /* Modal content */
    .modal-content {
      position: relative;
      width: 90%; max-width: 360px;
      padding: 24px 16px;
      border-radius: 12px;
      background: #222;
      overflow: hidden;
      animation: slideDown 0.4s ease forwards;
      box-shadow: 0 0 40px rgba(255,140,0,0.6);
      color: #fff;
    }

    .close {
      position: absolute;
      top: 8px; right: 12px;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 3;
      color: #fff;
    }

    #modalCategory {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    #modalScore {
      font-size: 3rem;
      text-align: center;
      color: #ffae00;
      animation: glow 1s ease-in-out infinite alternate;
      z-index: 3;
      position: relative;
    }

    #modalMessage {
      text-align: center;
      margin-top: 8px;
      line-height: 1.4;
      z-index: 3;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-50px); }
      to   { transform: translateY(0); }
    }

    @keyframes glow {
      0%   { text-shadow: 0 0 10px rgba(255,174,0,0.7); }
      100% { text-shadow: 0 0 20px rgba(255,69,0,1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Strength Checker</h1>
    <form id="strengthForm">
      <div class="form-group">
        <label for="age">Age (years)</label>
        <input type="number" id="age" min="10" max="100" placeholder="e.g. 28" required>
      </div>
      <div class="form-group">
        <label for="pushups">Push-ups in 1 min</label>
        <input type="number" id="pushups" min="0" max="100" placeholder="e.g. 30" required>
      </div>
      <div class="form-group">
        <label for="pullups">Pull-ups in 1 min</label>
        <input type="number" id="pullups" min="0" max="50" placeholder="e.g. 10" required>
      </div>
      <div class="form-group">
        <label for="squats">Squats in 1 min</label>
        <input type="number" id="squats" min="0" max="100" placeholder="e.g. 40">
      </div>
      <div class="form-group">
        <label for="plank">Plank hold (seconds)</label>
        <input type="number" id="plank" min="0" max="600" placeholder="e.g. 60">
      </div>
      <button type="button" id="calculateBtn">Calculate Strength</button>
    </form>
  </div>

  <!-- Modal -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalCategory"></div>
      <div id="modalScore"></div>
      <div id="modalMessage"></div>
    </div>
  </div>

  <script>
    const btn     = document.getElementById('calculateBtn');
    const modal   = document.getElementById('resultModal');
    const closeEl = modal.querySelector('.close');
    const catEl   = document.getElementById('modalCategory');
    const scoreEl = document.getElementById('modalScore');
    const msgEl   = document.getElementById('modalMessage');

    btn.addEventListener('click', () => {
      const age    = +document.getElementById('age').value;
      const push   = +document.getElementById('pushups').value;
      const pull   = +document.getElementById('pullups').value;
      const squat  = +document.getElementById('squats').value || 0;
      const plank  = +document.getElementById('plank').value || 0;

      let raw = push + pull * 2 + squat + plank / 5;
      const factor = age < 30 ? 1 : age < 50 ? 0.9 : 0.8;
      const finalScore = Math.min(100, Math.round(raw * factor));

      let category, message;
      if (finalScore >= 80) {
        category = 'Elite Strength';
        message  = 'You’re absolutely crushing it! 🔥';
      } else if (finalScore >= 60) {
        category = 'Advanced Strength';
        message  = 'Excellent work – power mode ON!';
      } else if (finalScore >= 40) {
        category = 'Intermediate Strength';
        message  = 'Solid foundation. Keep leveling up!';
      } else if (finalScore >= 20) {
        category = 'Beginner Strength';
        message  = 'Nice start, consistency is key!';
      } else {
        category = 'Novice Strength';
        message  = 'Let’s fire it up from here!';
      }

      catEl.textContent   = category;
      scoreEl.textContent = `${finalScore} / 100`;
      msgEl.textContent   = message;
      modal.classList.add('show');
    });

    closeEl.addEventListener('click', () => modal.classList.remove('show'));
    window.addEventListener('click', e => {
      if (e.target === modal) modal.classList.remove('show');
    });
  </script>
</body>
</html>
